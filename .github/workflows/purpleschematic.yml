name: PurpleSchematic checks

on:
  push:
    paths:
      - "purpleschematic/**"
      - ".github/workflows/purpleschematic.yml"
  pull_request:
    paths:
      - "purpleschematic/**"
      - ".github/workflows/purpleschematic.yml"

jobs:
  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: purpleschematic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts
      - run: npm run check

  fabric-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Compile Fabric adapter
        working-directory: purpleschematic/adapter-fabric
        run: gradle build

  forge-neoforge:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - loader: forge
            mc: "1.21.1"
            java: "21"
            gradle: "8.10.2"
          - loader: neoforge
            mc: "1.21.1"
            java: "21"
            gradle: "8.10.2"
          - loader: forge
            mc: "26.3"
            java: "25"
            gradle: "9.2.1"
          - loader: neoforge
            mc: "26.3"
            java: "25"
            gradle: "9.2.1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ matrix.gradle }}
      - name: Compile ${{ matrix.loader }} adapter for Minecraft ${{ matrix.mc }}
        working-directory: purpleschematic/adapter-${{ matrix.loader }}/${{ matrix.mc }}
        run: gradle build
