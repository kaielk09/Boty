plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[7.0.29,8.0)'
}
group = 'pl.purplecreator'
version = '26.3-0.3.0'
base { archivesName = 'purpleschematic-forge-26.3' }
java.toolchain.languageVersion = JavaLanguageVersion.of(25)
minecraft { mappings channel: 'official', version: '26.3' }
dependencies { minecraft "net.minecraftforge:forge:26.3-66.1.8" }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 25; options.compilerArgs += ['--add-modules', 'jdk.httpserver'] }
